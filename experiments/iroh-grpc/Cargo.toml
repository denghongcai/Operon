[package]
name = "operon-iroh-grpc-poc"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

# Deliberately isolated: no production dependencies, defaults or MSRV changes.
[workspace]

[dependencies]
anyhow = "1"
async-stream = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
prost = "0.14.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "=0.14.5", features = ["transport"] }
tonic-prost = "0.14.5"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tonic-prost-build = "0.14.5"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
