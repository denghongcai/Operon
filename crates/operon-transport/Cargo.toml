[package]
name = "operon-transport"
version = "0.16.14"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
iroh = ["dep:iroh", "dep:iroh-relay", "dep:rustls-pki-types", "dep:tokio", "dep:tokio-stream", "dep:tonic", "dep:tracing", "dep:operon-config", "dep:getrandom", "dep:tempfile", "dep:zeroize", "dep:libc", "dep:windows-sys"]

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"], optional = true }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["tls-ring"], optional = true }
rustls-pki-types = { version = "1", optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { version = "0.1", optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
operon-config = { path = "../operon-config", optional = true }
getrandom = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
zeroize = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"], optional = true }

[dev-dependencies]
operon-protocol = { path = "../operon-protocol" }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio.workspace = true
tokio-stream = "0.1"
tonic.workspace = true
tonic-health = "=0.14.5"
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "nat_acceptance"
required-features = ["iroh"]
