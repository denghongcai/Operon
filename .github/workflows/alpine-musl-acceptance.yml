name: Alpine musl Acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_archive_only:
        description: Upload only tar archives when used by Draft Release
        type: boolean
        default: false
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'packages/sdk-js/**'
      - 'pnpm-lock.yaml'
      - 'scripts/build-sdk-native.sh'
      - 'scripts/package-sdk-native.sh'
      - 'scripts/verify-sdk-native.mjs'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'scripts/*musl*'
      - 'scripts/*alpine*'
      - 'scripts/*libc*'
      - 'scripts/performance/**'
      - 'scripts/lib/release-*'
      - '.github/workflows/alpine-musl-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'packages/sdk-js/**'
      - 'pnpm-lock.yaml'
      - 'scripts/build-sdk-native.sh'
      - 'scripts/package-sdk-native.sh'
      - 'scripts/verify-sdk-native.mjs'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'scripts/*musl*'
      - 'scripts/*alpine*'
      - 'scripts/*libc*'
      - 'scripts/performance/**'
      - 'scripts/lib/release-*'
      - '.github/workflows/alpine-musl-acceptance.yml'

permissions:
  contents: read

jobs:
  native-build:
    name: Native musl Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      MUSL_BUILDER: rust@sha256:a3e3d30122c08c0ed85dcd8867d956f066be23c32ed67a0453bc04ce478ad69b
    steps:
      - uses: actions/checkout@v6
      - name: Verify native architecture
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Build and test public SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @operon/sdk typecheck
          pnpm --filter @operon/sdk test
          pnpm --filter @operon/sdk build
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            target/alpine-native
            .musl-cargo-cache
          key: alpine-musl-rust191-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: alpine-musl-rust191-${{ matrix.arch }}-
      - name: Build and test in pinned native Alpine environment
        run: |
          mkdir -p target/alpine-native .musl-cargo-cache
          docker run --rm \
            --mount type=bind,src="$PWD",dst=/workspace,readonly \
            --mount type=bind,src="$PWD/target/alpine-native",dst=/output \
            --mount type=bind,src="$PWD/.musl-cargo-cache",dst=/usr/local/cargo/registry \
            -e CARGO_TARGET_DIR=/output -e CARGO_INCREMENTAL=0 \
            "$MUSL_BUILDER" /bin/sh -ec '
              apk add --no-cache bash nodejs protobuf=29.4-r0 musl=1.2.5-r12 musl-dev=1.2.5-r12 acl >/dev/null
              cd /workspace
              bash scripts/build-musl-release.sh "${{ matrix.target }}"
              cargo +1.91.0 test --workspace --release --locked --target "${{ matrix.target }}" --features operon-transport/iroh
              bash scripts/package-musl-release.sh "${{ matrix.target }}" \
                /output/${{ matrix.target }}/release /output/dist
              CARGO_TARGET_DIR=/output/sdk bash scripts/build-sdk-native.sh \
                "${{ matrix.target }}" /output/sdk-native
              bash scripts/package-sdk-native.sh "${{ matrix.target }}" \
                /output/sdk-native /output/sdk-dist
            '
      - name: Native musl public SDK acceptance
        run: |
          for image in \
            alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
            alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0; do
            docker run --rm \
              --mount type=bind,src="$PWD/target/alpine-native",dst=/output,readonly \
              --mount type=bind,src="$PWD",dst=/workspace,readonly \
              -e OPERON_SDK_NATIVE_PATH=/output/sdk-native/operon-sdk-native.node \
              -e OPERON_NATIVE_TEST_DAEMON=/output/${{ matrix.target }}/release/operond \
              -e OPERON_EMBEDDED_TEST_TIMEOUT_SECS=180 \
              "$image" /bin/sh -ec '
                apk add --no-cache nodejs >/dev/null
                cd /workspace
                node --expose-gc scripts/verify-sdk-native.mjs
              '
          done
      - name: Baseline and secondary Alpine runtime integration
        run: |
          for image in \
            alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
            alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0; do
            docker run --rm \
              --mount type=bind,src="$PWD/target/alpine-native/${{ matrix.target }}/release",dst=/operon,readonly \
              --mount type=bind,src="$PWD",dst=/workspace,readonly \
              -e OPERON_INTEGRATION_BIN_DIR=/operon \
              "$image" /bin/sh -ec '
                apk add --no-cache bash python3 coreutils >/dev/null
                cat /etc/alpine-release
                /operon/operon --version
                /operon/operond --version
                /operon/operon mount --help >/dev/null
                cd /workspace
                bash scripts/verify-v0.8.1-integration-coverage.sh
              '
          done
      - name: Native Alpine live FUSE and runtime acceptance
        run: |
          if ! test -c /dev/fuse; then sudo modprobe fuse; fi
          test -c /dev/fuse
          for image in \
            alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
            alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0; do
            for identity in root nonroot; do
              docker run --rm --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
                --mount type=bind,src="$PWD",dst=/workspace,readonly \
                --mount type=bind,src="$PWD/target/alpine-native/${{ matrix.target }}/release",dst=/operon,readonly \
                -e OPERON_ALPINE_IDENTITY="$identity" \
                -e OPERON_ALPINE_ACCEPT_TIMEOUT_SECS="${OPERON_ALPINE_ACCEPT_TIMEOUT_SECS:-120}" \
                -e OPERON_ALPINE_STOP_TIMEOUT_SECS="${OPERON_ALPINE_STOP_TIMEOUT_SECS:-60}" \
                "$image" /bin/sh -ec '
                  apk add --no-cache python3 fuse3 >/dev/null
                  if [ "$OPERON_ALPINE_IDENTITY" = nonroot ]; then
                    adduser -D -u 1000 operon-test
                    su operon-test -s /bin/sh -c "python3 /workspace/scripts/alpine-runtime-acceptance.py --bin-dir /operon --live-mount"
                    su operon-test -s /bin/sh -c "python3 /workspace/scripts/alpine-runtime-acceptance.py --bin-dir /operon --live-mount --read-mode sync"
                  else
                    python3 /workspace/scripts/alpine-runtime-acceptance.py --bin-dir /operon --live-mount
                    python3 /workspace/scripts/alpine-runtime-acceptance.py --bin-dir /operon --live-mount --read-mode sync
                  fi
                '
            done
          done
      - name: Native rebooted Alpine OpenRC service acceptance
        run: |
          for image in \
            alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
            alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0; do
            bash scripts/run-alpine-openrc-acceptance.sh \
              "target/alpine-native/${{ matrix.target }}/release" "$image"
          done
      - name: Install pinned GNU comparison toolchain
        uses: dtolnay/rust-toolchain@1.91.0
      - name: Install GNU comparison protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '25.3'
          repo-token: ${{ github.token }}
      - name: Native identical-environment GNU and musl ops comparison
        run: |
          CARGO_TARGET_DIR=target/libc-gnu CARGO_INCREMENTAL=0 \
            cargo +1.91.0 build --release --locked -p operon-cli -p operond
          bash scripts/run-libc-comparison.sh target/libc-gnu/release \
            "target/alpine-native/${{ matrix.target }}/release" | tee target/libc-comparison.jsonl
      - name: Upload ops comparison evidence
        if: ${{ !inputs.release_archive_only }}
        uses: actions/upload-artifact@v7
        with:
          name: libc-ops-${{ matrix.arch }}
          path: target/libc-comparison.jsonl
          if-no-files-found: error
      - name: Upload native binaries
        if: ${{ !inputs.release_archive_only }}
        uses: actions/upload-artifact@v7
        with:
          name: musl-native-${{ matrix.arch }}
          path: |
            target/alpine-native/${{ matrix.target }}/release/operon
            target/alpine-native/${{ matrix.target }}/release/operond
            target/alpine-native/dist/*.tar.gz
          if-no-files-found: error
      - name: Upload release musl archive
        if: ${{ inputs.release_archive_only }}
        uses: actions/upload-artifact@v7
        with:
          name: musl-native-${{ matrix.arch }}
          path: |
            target/alpine-native/dist/*.tar.gz
            target/alpine-native/sdk-dist/*.tar.gz
          if-no-files-found: error
