name: Verify Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify, for example v0.12.2"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release-artifacts:
    name: Verify Release Artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Verify tagged validation source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$(git rev-parse HEAD)" = "$source_sha"
          echo "PUBLIC_ARTIFACT_SOURCE=$source_sha TAG=$RELEASE_TAG"

      - name: Install Node for downloaded public SDK acceptance
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pinned npm for release SDK dependencies
        shell: bash
        run: npm install --global npm@11.6.1 --ignore-scripts --no-audit --no-fund

      - name: Verify release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release-artifacts.sh "${{ inputs.tag }}" "${{ github.repository }}"
