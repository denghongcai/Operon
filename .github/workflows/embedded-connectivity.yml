name: Embedded Connectivity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/iroh-grpc/**'
      - 'crates/**'
      - 'proto/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'docker/iroh-relay/**'
      - 'scripts/verify-embedded-relay.sh'
      - 'scripts/verify-embedded-relay-containers.py'
      - 'scripts/verify-sdk-native.mjs'
      - 'docker/Dockerfile'
      - '.github/workflows/embedded-connectivity.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/iroh-grpc/**'
      - 'crates/**'
      - 'proto/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'docker/iroh-relay/**'
      - 'scripts/verify-embedded-relay.sh'
      - 'scripts/verify-embedded-relay-containers.py'
      - 'scripts/verify-sdk-native.mjs'
      - 'docker/Dockerfile'
      - '.github/workflows/embedded-connectivity.yml'

permissions:
  contents: read

jobs:
  poc:
    name: Embedded gRPC PoC and real daemon regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      OPERON_POC_TEST_TIMEOUT_SECS: '120'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            experiments/iroh-grpc -> target
          shared-key: embedded-iroh-poc-msrv191
      - uses: arduino/setup-protoc@v3
        with:
          version: '25.3'
          repo-token: ${{ github.token }}
      - name: Build unchanged real daemon
        run: cargo build --locked -p operond
      - name: Owned production transport stream and native HTTP2 tests
        env:
          OPERON_EMBEDDED_TEST_TIMEOUT_SECS: '120'
        run: |
          cargo test -p operon-transport --features iroh --locked -- --nocapture
          cargo clippy -p operon-transport --features iroh --all-targets --locked -- -D warnings
      - name: Native production daemon and Rust client capability acceptance
        env:
          OPERON_EMBEDDED_TEST_TIMEOUT_SECS: '120'
        run: cargo test -p operond --locked embedded_integration_tests -- --nocapture
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '10.33.2'
      - name: Build public SDK for native capability acceptance
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @operon/sdk typecheck
          pnpm --filter @operon/sdk test
          pnpm --filter @operon/sdk build
      - name: Build optional in-process SDK binding
        run: |
          cargo build -p operon-sdk-native --features node --locked
          cargo clippy -p operon-sdk-native --features node --all-targets --locked -- -D warnings
      - name: Real Node binding and native daemon RPC acceptance
        env:
          OPERON_SDK_NATIVE_PATH: ${{ github.workspace }}/target/debug/liboperon_sdk_native.so
          OPERON_EMBEDDED_TEST_TIMEOUT_SECS: '120'
        run: node scripts/verify-sdk-native.mjs
      - name: Native stream, authorization, fs, exec and cancellation tests
        env:
          OPERON_POC_DAEMON: ${{ github.workspace }}/target/debug/operond
        run: cargo test --manifest-path experiments/iroh-grpc/Cargo.toml --locked -- --nocapture
      - name: Check isolated PoC format and all-target Clippy
        run: |
          cargo fmt --manifest-path experiments/iroh-grpc/Cargo.toml -- --check
          cargo clippy --manifest-path experiments/iroh-grpc/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build locked cross-container examples
        run: docker build --build-context proto="$PWD/proto" -t operon-iroh-grpc-poc experiments/iroh-grpc
      - name: Actual distinct-container direct path and owned shutdown
        run: bash experiments/iroh-grpc/docker-run-cross-container.sh
      - name: Build version-pinned self-hosted relay acceptance image
        run: docker build -t operon-iroh-relay-acceptance docker/iroh-relay
      - name: Actual owned relay-only streams and relay traffic counters
        env:
          OPERON_EMBEDDED_TEST_TIMEOUT_SECS: '120'
        run: bash scripts/verify-embedded-relay.sh
      - name: Build production native daemon and CLI for isolated networks
        run: docker build -f docker/Dockerfile -t operon-native-iroh-acceptance .
      - name: Native daemon capabilities across disjoint networks and relay restart
        env:
          OPERON_EMBEDDED_TEST_TIMEOUT_SECS: '180'
        run: python3 scripts/verify-embedded-relay-containers.py
      # Phase 157 still requires NAT/direct upgrade, interrupted streaming,
      # additional capability/native mount scenarios and public SDK acceptance.
